name: Arbitraj Bot Bulut Taramasi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari Kur ve Playwright Tarayicisini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install gspread playwright requests
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Bot Motorunu Calistir
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python bot_motoru.py
